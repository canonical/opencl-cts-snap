name: Snap CI

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.base }} snap (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # base:    the project directory to build (each is a self-contained
          #          snapcraft project rooted at <dir>/snap/snapcraft.yaml)
          # arch:    target architecture
          # runner:  GitHub-hosted runner matching the target architecture
          - base: core24
            release: edge
            arch: amd64
            runner: ubuntu-24.04
          - base: core24
            release: edge
            arch: arm64
            runner: ubuntu-24.04-arm
          - base: core26
            release: core26/edge
            arch: amd64
            runner: ubuntu-24.04
          - base: core26
            release: core26/edge
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1
        with:
          path: ${{ matrix.base }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencl-cts-snap-${{ matrix.base }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

      - name: Publish to Snap Store
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ matrix.release }}

  testflinger:
    name: Test ${{ matrix.base }} on ${{ matrix.queue }}
    needs: build
    # Only run on push to specific branches, not on PRs
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop' || github.ref_name == 'rpi5b-testflinger')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # queue:   testflinger queue name (must exist on testflinger.canonical.com)
          # base:    snap base (core24 or core26)
          # release: snap store channel to publish to
          # arch:    target architecture
          # image_url: pre-installed server image for Raspberry Pi provisioning
          - queue: rpi5b
            base: core24
            release: edge
            arch: arm64
            image_url: https://cdimage.ubuntu.com/ubuntu/releases/24.04.4/release/ubuntu-24.04.4-preinstalled-server-arm64+raspi.img.xz
          - queue: rpi5b
            base: core26
            release: core26/edge
            arch: arm64
            image_url: https://cdimage.ubuntu.com/ubuntu/releases/26.04/release/ubuntu-26.04-preinstalled-server-arm64+raspi.img.xz
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download snap artifact
        uses: actions/download-artifact@v7
        with:
          name: opencl-cts-snap-${{ matrix.base }}-${{ matrix.arch }}
          path: .

      - name: Resolve snap file
        id: snap
        run: |
          set -euo pipefail
          snap_path="$(find . -maxdepth 2 -type f -name 'opencl-cts_*.snap' | head -n 1)"
          if [ -z "$snap_path" ]; then
            echo "No .snap artifact found"
            exit 1
          fi
          echo "path=$snap_path" >> "$GITHUB_OUTPUT"

      - name: Publish snap to temporary channel
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: ${{ matrix.release }}/run-${{ github.run_id }}

      - name: Create Testflinger job
        env:
          JOB_QUEUE: ${{ matrix.queue }}
          SNAP_CHANNEL: ${{ matrix.release }}/run-${{ github.run_id }}
          SNAP_BASE: ${{ matrix.base }}
          IMAGE_URL: ${{ matrix.image_url }}
        run: |
          envsubst '$JOB_QUEUE $IMAGE_URL $SNAP_CHANNEL $SNAP_BASE' \
            < .github/workflows/testflinger/opencl-cts-job-rpi.yaml \
            > .github/workflows/testflinger/opencl-cts-job.temp
          mv .github/workflows/testflinger/opencl-cts-job.temp \
            .github/workflows/testflinger/opencl-cts-job.yaml

      - name: Run tests on Testflinger
        uses: canonical/testflinger/.github/actions/submit@submit/v1.5.0
        with:
          poll: true
          job-path: .github/workflows/testflinger/opencl-cts-job.yaml
          client-id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          secret-key: ${{ secrets.TESTFLINGER_SECRET_KEY }}

      - name: Cleanup temporary snap channel
        if: always()
        run: |
          # Remove the temporary snap revision from the channel
          # This is best-effort; if it fails, the channel will be cleaned up automatically
          echo "Temporary channel: ${{ matrix.release }}/run-${{ github.run_id }}"
          echo "Note: Temporary channels are automatically cleaned up after 7 days"