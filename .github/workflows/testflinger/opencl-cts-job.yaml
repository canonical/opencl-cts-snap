# Testflinger job definition for OpenCL CTS testing
# Some variables should be replaced with envsubst before use
job_queue: $JOB_QUEUE
global_timeout: 14400
output_timeout: 3600
provision_data:
  distro: $DISTRO
test_data:
  attachments:
    - local: "scripts"
      agent: "scripts"
  test_cmds: |
    #!/usr/bin/env bash
    set -e
    export SNAP_CHANNEL=$SNAP_CHANNEL
    export SNAP_BASE=$SNAP_BASE
    ./attachments/test/scripts/agent.sh
