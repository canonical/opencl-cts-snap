# Testflinger job definition for OpenCL CTS testing on Raspberry Pi boards
# Some variables should be replaced with envsubst before use
job_queue: $JOB_QUEUE
global_timeout: 7200
output_timeout: 1800
provision_data:
  # Raspberry Pi queues provision by flashing a disk image from a URL
  url: $IMAGE_URL
test_data:
  attachments:
    - local: "scripts"
      agent: "scripts"
  test_cmds: |
    #!/usr/bin/env bash
    set -e
    export SNAP_CHANNEL=$SNAP_CHANNEL
    export SNAP_BASE=$SNAP_BASE
    ./attachments/test/scripts/agent.sh